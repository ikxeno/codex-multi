name: Feature request
description: Suggest a capability or improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what you are trying to accomplish.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example command or interaction if helpful.
    validations:
      required: true
